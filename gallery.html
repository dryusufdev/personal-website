  <main id="main">
    <section class="page-hero gallery-head">
      <div class="container">
        <p class="eyebrow fade">camera roll</p>
        <h1 class="fade d1">Places</h1>
        <p class="fade d1">Small pieces of where I&rsquo;ve been lately.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">

        <p class="places-kicker fade">places lately</p>
        <div class="places-lately fade d1">
          <button class="place" data-full="./assets/gallery/predalina-tampa.jpg" data-caption="predalina" data-loc="Tampa, Florida">
            <span class="place-img"><img src="./assets/gallery/predalina-tampa.jpg" alt="Amir sitting outside at Predalina in Tampa at night" loading="lazy" onerror="this.closest('.place-img').classList.add('no-img')" /></span>
            <span class="place-cap"><span class="c">predalina</span><span class="l">Tampa, Florida</span></span>
          </button>
          <button class="place" data-full="./assets/gallery/miami-airport.jpg" data-caption="airport" data-loc="Miami to Honduras">
            <span class="place-img"><img src="./assets/gallery/miami-airport.jpg" alt="Airport travel moment before flying to Honduras" loading="lazy" style="object-position:center 35%" onerror="this.closest('.place-img').classList.add('no-img')" /></span>
            <span class="place-cap"><span class="c">airport</span><span class="l">Miami to Honduras</span></span>
          </button>
          <button class="place" data-full="./assets/gallery/tegucigalpa-honduras.jpg" data-caption="tegucigalpa" data-loc="Honduras">
            <span class="place-img"><img src="./assets/gallery/tegucigalpa-honduras.jpg" alt="Street view in Tegucigalpa Honduras" loading="lazy" onerror="this.closest('.place-img').classList.add('no-img')" /></span>
            <span class="place-cap"><span class="c">tegucigalpa</span><span class="l">Honduras</span></span>
          </button>
          <button class="place" data-full="./assets/gallery/gunna-concert-tampa.jpg" data-caption="gunna" data-loc="Tampa, Florida">
            <span class="place-img"><img src="./assets/gallery/gunna-concert-tampa.jpg" alt="Gunna concert in Tampa with blue stage lighting" loading="lazy" onerror="this.closest('.place-img').classList.add('no-img')" /></span>
            <span class="place-cap"><span class="c">gunna</span><span class="l">Tampa, Florida</span></span>
          </button>
          <button class="place" data-full="./assets/gallery/santa-monica.jpg" data-caption="santa monica" data-loc="California">
            <span class="place-img"><img src="./assets/gallery/santa-monica.jpg" alt="Amir standing near the ocean at sunset in Santa Monica California" loading="lazy" style="object-position:center 30%" onerror="this.closest('.place-img').classList.add('no-img')" /></span>
            <span class="place-cap"><span class="c">santa monica</span><span class="l">California</span></span>
          </button>
        </div>

        <p class="places-kicker fade">the rest</p>
        <div class="phone-gallery fade d1">
          <button class="shot" style="--i:0" data-full="./assets/gallery/gallery-1.jpg" data-caption="los angeles" data-loc="Los Angeles, California"><img src="./assets/gallery/gallery-1.jpg" alt="Los Angeles California" loading="lazy" onerror="this.closest('.shot').classList.add('no-img')"><span class="ph-overlay" aria-hidden="true"><span class="c">los angeles</span><span class="l">Los Angeles, California</span></span></button>
          <button class="shot large" style="--i:1" data-full="./assets/gallery/las-vegas.jpg" data-caption="las vegas" data-loc="Las Vegas, Nevada"><img src="./assets/gallery/las-vegas.jpg" alt="Casino floor in Las Vegas with colorful slot machines and neon lighting" loading="lazy" onerror="this.closest('.shot').classList.add('no-img')"><span class="ph-overlay" aria-hidden="true"><span class="c">las vegas</span><span class="l">Las Vegas, Nevada</span></span></button>
          <button class="shot tall" style="--i:2" data-full="./assets/gallery/ovo-beverly-hills.jpg" data-caption="ovo" data-loc="Beverly Hills, California"><img src="./assets/gallery/ovo-beverly-hills.jpg" alt="Inside the OVO store in Beverly Hills with clothing displayed on a rack" loading="lazy" onerror="this.closest('.shot').classList.add('no-img')"><span class="ph-overlay" aria-hidden="true"><span class="c">ovo</span><span class="l">Beverly Hills, California</span></span></button>
          <button class="shot wide" style="--i:3" data-full="./assets/gallery/downtown-los-angeles.jpg" data-caption="downtown la" data-loc="Los Angeles, California"><img src="./assets/gallery/downtown-los-angeles.jpg" alt="Driving view toward the downtown Los Angeles skyline at sunset" loading="lazy" onerror="this.closest('.shot').classList.add('no-img')"><span class="ph-overlay" aria-hidden="true"><span class="c">downtown la</span><span class="l">Los Angeles, California</span></span></button>
          <button class="shot wide" style="--i:4" data-full="./assets/gallery/denver-colorado.jpg" data-caption="denver" data-loc="Denver, Colorado"><img src="./assets/gallery/denver-colorado.jpg" alt="Interior of Denver airport with open atrium and suspended airplane display" loading="lazy" onerror="this.closest('.shot').classList.add('no-img')"><span class="ph-overlay" aria-hidden="true"><span class="c">denver</span><span class="l">Denver, Colorado</span></span></button>
          <button class="shot tall" style="--i:5" data-full="./assets/gallery/dallas-texas.jpg" data-caption="dallas" data-loc="Dallas, Texas"><img src="./assets/gallery/dallas-texas.jpg" alt="Airplane wing seen through a window during a flight near Dallas Texas" loading="lazy" onerror="this.closest('.shot').classList.add('no-img')"><span class="ph-overlay" aria-hidden="true"><span class="c">dallas</span><span class="l">Dallas, Texas</span></span></button>
          <button class="shot" style="--i:6" data-full="./assets/gallery/gallery-3.jpg" data-caption="north florida fair" data-loc="Tallahassee, Florida"><img src="./assets/gallery/gallery-3.jpg" alt="North Florida Fair in Tallahassee at night" loading="lazy" onerror="this.closest('.shot').classList.add('no-img')"><span class="ph-overlay" aria-hidden="true"><span class="c">north florida fair</span><span class="l">Tallahassee, Florida</span></span></button>
          <button class="shot" style="--i:7" data-full="./assets/gallery/gallery-4.jpg" data-caption="gunna concert" data-loc="Tampa, Florida"><img src="./assets/gallery/gallery-4.jpg" alt="Gunna concert in Tampa Florida" loading="lazy" onerror="this.closest('.shot').classList.add('no-img')"><span class="ph-overlay" aria-hidden="true"><span class="c">gunna concert</span><span class="l">Tampa, Florida</span></span></button>
          <button class="shot" style="--i:8" data-full="./assets/gallery/gallery-5.jpg" data-caption="tegucigalpa" data-loc="Honduras"><img src="./assets/gallery/gallery-5.jpg" alt="Tegucigalpa Honduras" loading="lazy" onerror="this.closest('.shot').classList.add('no-img')"><span class="ph-overlay" aria-hidden="true"><span class="c">tegucigalpa</span><span class="l">Honduras</span></span></button>
          <button class="shot" style="--i:9" data-full="./assets/gallery/gallery-6.jpg" data-caption="construction" data-loc="Tegucigalpa, Honduras"><img src="./assets/gallery/gallery-6.jpg" alt="Construction roof view in Tegucigalpa Honduras" loading="lazy" onerror="this.closest('.shot').classList.add('no-img')"><span class="ph-overlay" aria-hidden="true"><span class="c">construction</span><span class="l">Tegucigalpa, Honduras</span></span></button>
          <button class="shot" style="--i:10" data-full="./assets/gallery/gallery-9.jpg" data-caption="yard house" data-loc="Tampa, Florida"><img src="./assets/gallery/gallery-9.jpg" alt="Yard House in Tampa Florida" loading="lazy" onerror="this.closest('.shot').classList.add('no-img')"><span class="ph-overlay" aria-hidden="true"><span class="c">yard house</span><span class="l">Tampa, Florida</span></span></button>
          <button class="shot" style="--i:11" data-full="./assets/gallery/gallery-10.jpg" data-caption="capital one café" data-loc="Tampa, Florida"><img src="./assets/gallery/gallery-10.jpg" alt="Capital One Café coffee walk" loading="lazy" onerror="this.closest('.shot').classList.add('no-img')"><span class="ph-overlay" aria-hidden="true"><span class="c">capital one café</span><span class="l">Tampa, Florida</span></span></button>
        </div>
      </div>
    </section>
