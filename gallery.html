  <main id="main">
    <section class="page-hero gallery-head">
      <div class="container">
        <p class="eyebrow fade">camera roll</p>
        <h1 class="fade d1">places</h1>
        <p class="fade d1">small pieces of where i've been lately.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">

        <p class="places-kicker fade">places lately</p>
        <div class="places-lately fade d1">
          <button class="place" data-full="./assets/gallery/predalina-tampa.jpg" data-caption="predalina" data-loc="Tampa, Florida">
            <span class="place-img"><img src="./assets/gallery/predalina-tampa.jpg" alt="Amir sitting outside at Predalina in Tampa at night" loading="lazy" onerror="this.closest('.place-img').classList.add('no-img')" /></span>
            <span class="place-cap"><span class="c">predalina</span><span class="l">Tampa, Florida</span></span>
          </button>
          <button class="place" data-full="./assets/gallery/miami-airport.jpg" data-caption="airport" data-loc="Miami to Honduras">
            <span class="place-img"><img src="./assets/gallery/miami-airport.jpg" alt="Airport travel moment before flying to Honduras" loading="lazy" style="object-position:center 35%" onerror="this.closest('.place-img').classList.add('no-img')" /></span>
            <span class="place-cap"><span class="c">airport</span><span class="l">Miami to Honduras</span></span>
          </button>
          <button class="place" data-full="./assets/gallery/tegucigalpa-honduras.jpg" data-caption="tegucigalpa" data-loc="Honduras">
            <span class="place-img"><img src="./assets/gallery/tegucigalpa-honduras.jpg" alt="Street view in Tegucigalpa Honduras" loading="lazy" onerror="this.closest('.place-img').classList.add('no-img')" /></span>
            <span class="place-cap"><span class="c">tegucigalpa</span><span class="l">Honduras</span></span>
          </button>
          <button class="place" data-full="./assets/gallery/gunna-concert-tampa.jpg" data-caption="gunna" data-loc="Tampa, Florida">
            <span class="place-img"><img src="./assets/gallery/gunna-concert-tampa.jpg" alt="Gunna concert in Tampa with blue stage lighting" loading="lazy" onerror="this.closest('.place-img').classList.add('no-img')" /></span>
            <span class="place-cap"><span class="c">gunna</span><span class="l">Tampa, Florida</span></span>
          </button>
          <button class="place" data-full="./assets/gallery/santa-monica.jpg" data-caption="santa monica" data-loc="California">
            <span class="place-img"><img src="./assets/gallery/santa-monica.jpg" alt="Amir standing near the ocean at sunset in Santa Monica California" loading="lazy" style="object-position:center 30%" onerror="this.closest('.place-img').classList.add('no-img')" /></span>
            <span class="place-cap"><span class="c">santa monica</span><span class="l">California</span></span>
          </button>
        </div>

        <p class="places-kicker fade">the rest</p>
        <div class="masonry fade d1">
          <button class="shot" data-full="./assets/gallery/gallery-1.jpg" data-caption="california" data-loc="California"><img src="./assets/gallery/gallery-1.jpg" alt="California" loading="lazy" onerror="this.closest('.shot').classList.add('no-img')"><span class="ph-overlay" aria-hidden="true"><span class="c">california</span><span class="l">California</span></span></button>
          <button class="shot" data-full="./assets/gallery/gallery-2.jpg" data-caption="sunset" data-loc="California"><img src="./assets/gallery/gallery-2.jpg" alt="Sunset" loading="lazy" onerror="this.closest('.shot').classList.add('no-img')"><span class="ph-overlay" aria-hidden="true"><span class="c">sunset</span><span class="l">California</span></span></button>
          <button class="shot" data-full="./assets/gallery/gallery-3.jpg" data-caption="fair night" data-loc=""><img src="./assets/gallery/gallery-3.jpg" alt="Fair night" loading="lazy" onerror="this.closest('.shot').classList.add('no-img')"><span class="ph-overlay" aria-hidden="true"><span class="c">fair night</span></span></button>
          <button class="shot" data-full="./assets/gallery/gallery-4.jpg" data-caption="concert" data-loc="Tampa, Florida"><img src="./assets/gallery/gallery-4.jpg" alt="Concert" loading="lazy" onerror="this.closest('.shot').classList.add('no-img')"><span class="ph-overlay" aria-hidden="true"><span class="c">concert</span><span class="l">Tampa, Florida</span></span></button>
          <button class="shot" data-full="./assets/gallery/gallery-5.jpg" data-caption="honduras" data-loc="Honduras"><img src="./assets/gallery/gallery-5.jpg" alt="Honduras" loading="lazy" onerror="this.closest('.shot').classList.add('no-img')"><span class="ph-overlay" aria-hidden="true"><span class="c">honduras</span><span class="l">Honduras</span></span></button>
          <button class="shot" data-full="./assets/gallery/gallery-6.jpg" data-caption="roof view" data-loc=""><img src="./assets/gallery/gallery-6.jpg" alt="Roof view" loading="lazy" onerror="this.closest('.shot').classList.add('no-img')"><span class="ph-overlay" aria-hidden="true"><span class="c">roof view</span></span></button>
          <button class="shot" data-full="./assets/gallery/gallery-7.jpg" data-caption="airport" data-loc="Miami to Honduras"><img src="./assets/gallery/gallery-7.jpg" alt="Airport" loading="lazy" onerror="this.closest('.shot').classList.add('no-img')"><span class="ph-overlay" aria-hidden="true"><span class="c">airport</span><span class="l">Miami to Honduras</span></span></button>
          <button class="shot" data-full="./assets/gallery/gallery-8.jpg" data-caption="pizza night" data-loc=""><img src="./assets/gallery/gallery-8.jpg" alt="Pizza night" loading="lazy" onerror="this.closest('.shot').classList.add('no-img')"><span class="ph-overlay" aria-hidden="true"><span class="c">pizza night</span></span></button>
          <button class="shot" data-full="./assets/gallery/gallery-9.jpg" data-caption="downtown" data-loc=""><img src="./assets/gallery/gallery-9.jpg" alt="Downtown" loading="lazy" onerror="this.closest('.shot').classList.add('no-img')"><span class="ph-overlay" aria-hidden="true"><span class="c">downtown</span></span></button>
          <button class="shot" data-full="./assets/gallery/gallery-10.jpg" data-caption="coffee walk" data-loc=""><img src="./assets/gallery/gallery-10.jpg" alt="Coffee walk" loading="lazy" onerror="this.closest('.shot').classList.add('no-img')"><span class="ph-overlay" aria-hidden="true"><span class="c">coffee walk</span></span></button>
        </div>
      </div>
    </section>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close photo viewer">✕</button>
    <figure class="lightbox-fig">
      <img id="lightboxImg" src="" alt="" />
      <figcaption><span class="c" id="lightboxCap"></span><span class="l" id="lightboxLoc"></span></figcaption>
    </figure>
  </div>

  <footer class="footer">
    <div class="container footer-inner"></div>
  </footer>
