<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG Card - Amir Yusuf</title>
<!--
  Share-preview template for /assets/og-image.jpg (1200 × 630).
  Open in a browser, screenshot the .card at exactly 1200×630, save as assets/og-image.jpg.
  Headless: npx playwright screenshot --viewport-size=1200,630 assets/og-template.html assets/og-image.jpg
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz@1,6..72&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a1a; display: grid; place-items: center; min-height: 100vh; font-family: 'Instrument Sans', system-ui, sans-serif; }
  .card {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: #050505; color: #F5F5F0;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 70px 80px;
  }
  .card::before {
    content: ""; position: absolute; inset: 34px;
    border: 1px solid rgba(255,255,255,0.12); border-radius: 18px;
  }
  .top, .bottom { position: relative; z-index: 2; }
  .eyebrow { font-family: 'Newsreader', serif; font-style: italic; font-size: 26px; color: #9C9C9C; }
  .name { margin-top: 18px; font-size: 132px; font-weight: 600; letter-spacing: -0.04em; line-height: 0.95; }
  .sub { margin-top: 22px; font-size: 30px; font-weight: 500; }
  .bottom { display: flex; justify-content: space-between; align-items: flex-end; font-size: 22px; color: #9C9C9C; }
  .bottom b { color: #F5F5F0; font-weight: 500; }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="eyebrow">Tallahassee, FL</span>
      <div class="name">Amir Yusuf</div>
      <div class="sub">Neuroscience student at Florida State University.</div>
    </div>
    <div class="bottom">
      <span>medicine · research · design · building small things</span>
      <span><b>amiryusuf.com</b></span>
    </div>
  </div>
</body>
</html>
